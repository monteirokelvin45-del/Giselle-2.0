# ============================================================
# .github/workflows/tests.yml
# ------------------------------------------------------------
# Roda a suite de testes unitários (SafetyGate, AgentOrchestrator,
# AppLauncher, CircuitBreaker, etc.) automaticamente a cada push
# e pull request — sem precisar lembrar de rodar local.
#
# Os testes usam fakes/mocks e não chamam APIs reais.
# Só um local.properties mínimo é necessário pro Gradle não falhar
# ao ler as propriedades no build.gradle.kts.
# ============================================================

name: Testes unitários

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: local.properties mínimo
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "PROXY_BASE_URL=" >> local.properties
          echo "PROXY_SHARED_SECRET=" >> local.properties

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Rodar testes unitários (testDebugUnitTest)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --continue 2>&1 | tee gradle-test.log

      - name: Anotar causa da falha (visível pela API de checks)
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |What went wrong|FAILED|Exception|Could not |Execution failed|Caused by" gradle-test.log || true; \
            grep -E "^> " gradle-test.log | grep -v "^> Task" || true; } \
            | head -40 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error title=Falha de teste::${msg}"
            done
          echo "--- últimas linhas ---"
          tail -n 40 gradle-test.log

      - name: Publicar relatório de testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Publicar log completo do Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-testes-gradle
          path: gradle-test.log
          if-no-files-found: warn
