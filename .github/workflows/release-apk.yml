# Compila o APK de depuração e publica como GitHub Release (baixável por link).
# Para APK de release assinado, configure os segredos KEYSTORE_* (ver ATUALIZACOES.md).
name: Publicar APK

on:
  workflow_dispatch:
  push:
    branches: [arena/7b215d95-giselle-2-0]
    paths: [".github/workflows/release-apk.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: local.properties
        env:
          PROXY_BASE_URL: ${{ secrets.PROXY_BASE_URL }}
          PROXY_SHARED_SECRET: ${{ secrets.PROXY_SHARED_SECRET }}
        run: |
          printf 'sdk.dir=%s\nPROXY_BASE_URL=%s\nPROXY_SHARED_SECRET=%s\n' "$ANDROID_HOME" "$PROXY_BASE_URL" "$PROXY_SHARED_SECRET" > local.properties

      - name: Compilar APK de depuração
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "giselle-debug-${{ github.run_number }}.apk"

      - name: Criar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          TAG="apk-${{ github.run_number }}"
          APK="giselle-debug-${{ github.run_number }}.apk"
          NOTES="APK de depuração gerado a partir de \`${{ github.ref_name }}\` (${GITHUB_SHA:0:7}). Assinado com a chave de depuração: não substitui uma versão de release assinada."
          # Falhas transitórias de rede/upload são comuns com APKs grandes: tenta de novo
          # e, se a release já foi criada numa tentativa anterior, só envia o asset.
          for tentativa in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" --clobber && exit 0
            elif gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
                --title "Giselle APK #${{ github.run_number }} (depuração)" --notes "$NOTES"; then
              exit 0
            fi
            echo "::warning::Tentativa $tentativa de publicar $TAG falhou; nova tentativa em 20 s"
            sleep 20
          done
          echo "::error::Não foi possível publicar $TAG após 3 tentativas"
          exit 1
