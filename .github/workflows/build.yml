name: Build Giselle APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_AVAILABLE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare local.properties
        run: |
          printf 'sdk.dir=%s\nPROXY_BASE_URL=\nPROXY_SHARED_SECRET=\n' "$ANDROID_HOME" > local.properties
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Anotar causa da falha do build
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |What went wrong|FAILED|Exception|Could not |Execution failed|Caused by" gradle-build.log || true; \
            grep -E "^> " gradle-build.log | grep -v "^> Task" || true; } \
            | head -40 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error title=Falha de compilação::${msg}"
            done
          tail -n 40 gradle-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: giselle-apk-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare release keystore
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/giselle.jks
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["KEYSTORE_PATH"]).write_bytes(base64.b64decode("".join(os.environ["KEYSTORE_BASE64"].split()), validate=True))'
      - name: Build signed release APK
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/giselle.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        with:
          name: giselle-apk-release
          path: app/build/outputs/apk/release/*.apk
